[package]
name = "doc4me-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Doc4Me document model: stories, paragraphs, runs, tables, sections, styles, numbering, fields, notes, comments, revisions; edit primitives"

[lints]
workspace = true

[dependencies]
doc4me-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-segmentation = { workspace = true }
icu_segmenter = { workspace = true }

[features]
