# Measures the readiness percentage on Windows (windows-latest) for the owner's record: downloads
# the 220-document corpus, runs `cargo xtask readiness --corpus` with Doc4Me's release CLI, and
# commits the regenerated docs/readiness.md to main with [skip ci]. Run it from the Actions tab
# (workflow_dispatch) only, so it doesn't use runner minutes on every push.
name: Readiness (Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readiness-windows
  cancel-in-progress: false

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1

      - name: Check out the pinned open font set
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: c1db6d1a8ed772191241c3d185e2104be84d8691
          path: craft-fonts
          persist-credentials: false

      - name: Prepare pinned corpus fonts
        shell: bash
        run: python tools/prepare_corpus_fonts.py craft-fonts

      - name: Require the open fonts for Windows readiness
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CRAFT_FONTS_DIR=$env:GITHUB_WORKSPACE\craft-fonts"
          Add-Content -Path $env:GITHUB_ENV -Value 'CRAFT_FONTS_REQUIRED=1'

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The corpus check compares page counts and breaks with poppler's pdfinfo and pdftotext.
      - name: Install poppler
        shell: pwsh
        run: |
          # The community feed sometimes answers 406 for the package's metadata (run 41564657737);
          # a retry fetches it again.
          $installed = $false
          for ($i = 1; $i -le 3; $i++) {
            choco install poppler -y --no-progress
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            Start-Sleep -Seconds 30
          }
          if (-not $installed) { Write-Error "choco could not install poppler after 3 attempts"; exit 1 }
          $bin = Get-ChildItem "C:\ProgramData\chocolatey\lib\poppler" -Recurse -Filter pdfinfo.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bin) { Write-Error "pdfinfo.exe not found after installing poppler"; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName
          & $bin.FullName -v

      # Downloads can be reset by the servers; each file is fetched again on the next attempt.
      - name: Download the corpus
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            cargo xtask readiness --download
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { Write-Error "corpus download failed after 3 attempts"; exit 1 }

      - name: Measure readiness
        shell: pwsh
        run: cargo xtask readiness --corpus --jobs 4 --diagnostics

      # Diagnose the actual remaining page-count failures plus the verified fixes/platform
      # comparison. This does not change the corpus, reference documents or readiness criteria.
      - name: Inspect Windows font resolution for current page-count failures
        shell: pwsh
        run: |
          $cli = Join-Path $env:GITHUB_WORKSPACE 'target/release/doc4me-cli.exe'
          $reportText = Get-Content -Raw docs/readiness.md
          $pageFailureBody = [regex]::Match($reportText, '(?ms)^### corpus-pages \([^\r\n]+\)\r?\n(?<body>.*?)(?=^#{1,3} |\z)').Groups['body'].Value
          $ids = @('zenodo-095', 'zenodo-149', 'zenodo-114')
          foreach ($rowMatch in [regex]::Matches($pageFailureBody, '(?m)^- `([^`]+)`')) {
            $ids += $rowMatch.Groups[1].Value
          }
          foreach ($id in ($ids | Sort-Object -Unique)) {
            $document = Join-Path $env:GITHUB_WORKSPACE "corpus/readiness/$id.docx"
            # A row set to `excluded` in corpus.tsv isn't downloaded: a diagnostic, not a failure.
            if (-not (Test-Path $document)) { Write-Output "--- ${id}: not in the corpus download (excluded?), skipped ---"; continue }
            Write-Output "--- $id ---"
            & $cli run --file $document --cmd 'file.fontSubstitution={}' --cmd 'file.info={}' --print
            if ($LASTEXITCODE -ne 0) { throw "Font-resolution diagnostic failed for $id" }
          }

      # zenodo-123 matches Word's page count on Linux (38) but not here (39) with the same open
      # fonts: print each page's first and last text line so the two platforms can be compared.
      # Diagnostic only; it never fails the measurement.
      - name: Page ends of documents that differ between platforms
        shell: pwsh
        continue-on-error: true
        run: |
          $cli = Join-Path $env:GITHUB_WORKSPACE 'target/release/doc4me-cli.exe'
          foreach ($id in @('zenodo-053')) {
            $document = Join-Path $env:GITHUB_WORKSPACE "corpus/readiness/$id.docx"
            if (-not (Test-Path $document)) { Write-Output "--- ${id}: not downloaded, skipped ---"; continue }
            $pdf = Join-Path $env:RUNNER_TEMP "$id.pdf"
            & $cli convert $document $pdf | Out-Null
            $pages = [int]([regex]::Match((pdfinfo $pdf | Out-String), 'Pages:\s+(\d+)').Groups[1].Value)
            Write-Output "--- $id ($pages pages) ---"
            for ($p = 1; $p -le $pages; $p++) {
              $lines = @(pdftotext -f $p -l $p -layout $pdf - | Where-Object { $_.Trim() -ne '' })
              if ($lines.Count -gt 0) { Write-Output ("p{0} first: {1}" -f $p, $lines[0].Trim()); Write-Output ("p{0} last:  {1}" -f $p, $lines[-1].Trim()) }
            }
          }

      - name: Render Thai readiness report
        shell: bash
        run: python tools/readiness_th.py

      - name: Refresh bilingual readiness blockers from this measurement
        shell: bash
        run: python tools/readiness_blockers.py

      # README.md and README.en.md quote the same run, scores and corpus results as the reports.
      - name: Keep the README readiness numbers equal to this measurement
        shell: bash
        run: python tools/readiness_readme.py

      - name: Summary
        shell: pwsh
        run: |
          $line = Select-String -Path docs/readiness.md -Pattern 'Measured readiness|Not final' | Select-Object -First 1
          "### Readiness (Windows)`n`n$($line.Line)" >> $env:GITHUB_STEP_SUMMARY

      - name: Commit the measurement to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/readiness.md docs/readiness.th.md docs/readiness/blockers-2026-11-14.md docs/readiness/blockers-2026-11-14.th.md docs/readiness/blockers-2026-11-14.tsv README.md README.en.md
          if git diff --cached --quiet; then
            echo "docs/readiness.md unchanged"
            exit 0
          fi
          git commit -m "Readiness: measured on Windows (run $GITHUB_RUN_ID) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::could not push the measurement to main"
          exit 1
