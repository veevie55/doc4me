# Build and inspect the Windows ARM64 packages on a real Windows runner. This workflow is
# workflow_dispatch-only: it does not create a Release, upload packages, or publish a build.
name: Windows ARM64 packaging readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust (MSVC, arm64 target)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install WiX v5 and extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Install or verify Ninja and clang-cl
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version
          clang-cl --version

      - name: Build and package (arm64)
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch arm64

      - name: Verify package files and record hashes
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -Path dist/release -Filter '*-windows-arm64.msi' -File)
          $zip = @(Get-ChildItem -Path dist/release -Filter '*-windows-arm64-portable.zip' -File)
          if ($msi.Count -eq 0) { throw 'No Windows ARM64 MSI was produced' }
          if ($zip.Count -eq 0) { throw 'No Windows ARM64 portable ZIP was produced' }
          foreach ($file in ($msi + $zip)) {
            $hash = Get-FileHash -Algorithm SHA256 $file.FullName
            Write-Output "$($file.Name) sha256=$($hash.Hash)"
          }
