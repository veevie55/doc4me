# Manual builds only. The workflow definition comes from the branch selected in Actions;
# `ref` selects the source code to build and `version` the version number it shows (optional).
# No push/tag/PR/schedule triggers; the Release workflow (release.yml) may call it.
name: Build macOS
run-name: "Build macOS · ${{ inputs.ref }}${{ inputs.version && format(' · {0}', inputs.version) || '' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source branch, tag, or commit SHA (main = latest code)'
        required: true
        type: string
        default: main
      version:
        description: 'Version number shown in About and --version, e.g. 1.2.0 or 1.2.0-rc.1 (empty = the commit only)'
        required: false
        type: string
        default: ''
      file-name:
        description: 'Name the download files by commit (doc4me-<commit>-...) or by version (doc4me-<version>-..., needs a version)'
        required: false
        type: choice
        default: commit
        options:
          - commit
          - version
      arch:
        description: 'macOS architecture'
        required: true
        type: choice
        default: universal
        options:
          - universal
          - aarch64
          - x86_64
  # The Release workflow (release.yml) calls this build with the commit and version it resolved.
  workflow_call:
    inputs:
      ref:
        description: 'Source commit SHA to build'
        required: true
        type: string
      version:
        description: 'Version number shown in About and --version (empty = the commit only)'
        required: false
        type: string
        default: ''
      file-name:
        description: 'Name the download files by commit or version'
        required: false
        type: string
        default: commit
      arch:
        description: 'macOS architecture: universal, aarch64 or x86_64'
        required: false
        type: string
        default: universal

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out the selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the actual source commit
        id: source
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          FILE_NAME: ${{ inputs.file-name }}
        run: |
          commit=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'DOC4ME_BUILD_SHA=%s\n' "$commit" >> "$GITHUB_ENV"
          mkdir -p dist/release
          # The version typed in the form: checked here (never pasted into a script), then given to
          # the build as DOC4ME_VERSION. Numbers fit the MSI ProductVersion (255.255.65535).
          version="${REQUESTED_VERSION#v}"
          if [ -n "$REQUESTED_VERSION" ]; then
            semver='^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [ "${#version}" -gt 64 ] || ! [[ "$version" =~ $semver ]] ||
              [ "${BASH_REMATCH[1]}" -gt 255 ] || [ "${BASH_REMATCH[2]}" -gt 255 ] || [ "${BASH_REMATCH[3]}" -gt 65535 ]; then
              echo '::error::version must look like 1.2.3 or 1.2.3-rc.1 (major and minor up to 255, patch up to 65535)'
              exit 1
            fi
            printf 'DOC4ME_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
            printf '%s\n' "$version" > "dist/release/VERSION.txt"
          fi
          printf '%s\n' "$commit" > dist/release/SOURCE_COMMIT.txt
          # File names: the commit (default) or the version number (packaging/env.sh, package.ps1).
          file_name="${FILE_NAME:-commit}"
          case "$file_name" in
            commit) ;;
            version)
              if [ -z "$version" ]; then
                echo '::error::file names by version need a version number'
                exit 1
              fi
              ;;
            *)
              echo '::error::file-name must be commit or version'
              exit 1
              ;;
          esac
          printf 'DOC4ME_FILE_NAME=%s\n' "$file_name" >> "$GITHUB_ENV"
          printf '### Build macOS\n\nSource commit: `%s`\n' "$commit" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$version" ]; then printf '\nVersion: `%s`\n' "$version" >> "$GITHUB_STEP_SUMMARY"; fi
          printf '\nFile names: by %s\n' "$file_name" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the About tool (this workflow's revision)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .doc4me-workflow
          sparse-checkout: |
            tools/about_label.py
            crates/ui-egui/src/i18n/*.tsv
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Sources older than build_info::about_line don't follow the file-name choice in About:
      # tools/about_label.py patches their About dialog to match and leaves newer sources unchanged.
      - name: Show the chosen version or commit in About
        shell: bash
        run: |
          python3 .doc4me-workflow/tools/about_label.py . .doc4me-workflow/crates/ui-egui/src/i18n
          rm -rf .doc4me-workflow

      - name: Install Rust and both macOS targets
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-${{ inputs.arch }}

      # No signing credentials are passed to selected commits. The package is ad-hoc signed.
      - name: Build DMG and CLI ZIP
        env:
          MAC_ARCH: ${{ inputs.arch }}
        run: packaging/macos/package.sh --arch "$MAC_ARCH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doc4me-macos-${{ inputs.arch }}-${{ steps.source.outputs.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
